name: Lint

on:
  push:
    branches:
      - dev
      - stg
      - main
  pull_request:
    branches:
      - dev
      - stg
      - main

jobs:
  lint:
    name: flutter analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee analyze_output.txt

      - name: Comment lint issues on PR
        if: steps.analyze.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('analyze_output.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Lint failed\n\n\`\`\`\n${output}\n\`\`\``,
            });

      - name: Fail if analyze failed
        if: steps.analyze.outcome == 'failure'
        run: exit 1
